name: validate-data

# Every push and PR revalidates the data against its schema and checks that the
# committed codebook.md matches what the generator produces. A drifted codebook
# fails the build — you cannot merge a codebook that no longer matches the schema.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install frictionless pyyaml

      - name: Validate controlled vocabularies
        # The vocabularies are not frictionless resources, so the step below
        # never sees them — yet they carry allowed_values, the component
        # assignments and the dependence columns the datasets are checked
        # against. Two rows once shipped with an unquoted comma inside a field,
        # shifting every value after it and silently dropping a form code.
        run: python scripts/check_vocabularies.py

      - name: Check dependence columns
        # applicability_on and dependence_group are conditional constraints: which
        # values a cell may take depends on another cell in the same form. A Table
        # Schema cannot express that, so frictionless never sees it and the step
        # below cannot catch a .NA whose parent does not block. CLAUDE.md has always
        # listed this among the checks before a PR; CI did not run it until
        # 2026-08-16, when a PY0/MC1 dependency test surfaced a particular_average
        # row whose value contradicted its own note.
        run: |
          for d in datasets/*/; do
            [[ "$d" == datasets/_template/ ]] && continue
            echo "Checking $d"
            python scripts/check_dependence.py "$d"
          done

      - name: Validate every datapackage against its data
        run: |
          for dp in datasets/*/datapackage.json; do
            [[ "$dp" == datasets/_template/* ]] && continue
            echo "Validating $dp"
            frictionless validate "$dp"
          done

      - name: Check codebooks are up to date
        run: |
          python scripts/build_codebook.py
          if ! git diff --exit-code -- 'datasets/*/codebook.md'; then
            echo "::error::codebook.md is out of date. Run scripts/build_codebook.py and commit."
            exit 1
          fi

      - name: Check committed views are up to date
        # views/ is generated from the same data as codebook.md and goes stale the
        # same way, but nothing checked it until 2026-08-31: the risk-pooling .tex
        # sat seventeen forms behind its own .md sibling from 9 to 30 August 2026
        # while every other check passed. Dated snapshots (...-YYYY-MM-DD.ext) are
        # deliberate frozen artefacts and are skipped.
        run: |
          for f in views/*; do
            b=$(basename "$f"); ext="${b##*.}"; stem="${b%.*}"
            case "$ext" in md|tex) ;; *) continue ;; esac
            case "$stem" in *-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]) continue ;; esac
            ds="${stem%%--*}"; comp="${stem#*--}"
            extra=""
            [[ "$ds" == organizational_forms ]] && extra="--mechanism all"
            echo "Rebuilding $ds / $comp / $ext"
            python scripts/build_views.py --dataset "$ds" --component "$comp" --format "$ext" $extra
          done
          if ! git diff --exit-code -- 'views/*'; then
            echo "::error::a committed view is out of date. Run scripts/build_views.py and commit."
            exit 1
          fi
