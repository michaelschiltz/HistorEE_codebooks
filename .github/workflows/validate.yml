name: validate-data

# Every push and PR revalidates the data against its schema and checks that the
# committed codebook.md matches what the generator produces. A drifted codebook
# fails the build — you cannot merge a codebook that no longer matches the schema.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install frictionless pyyaml

      - name: Validate controlled vocabularies
        # The vocabularies are not frictionless resources, so the step below
        # never sees them — yet they carry allowed_values, the component
        # assignments and the dependence columns the datasets are checked
        # against. Two rows once shipped with an unquoted comma inside a field,
        # shifting every value after it and silently dropping a form code.
        run: python scripts/check_vocabularies.py

      - name: Validate every datapackage against its data
        run: |
          for dp in datasets/*/datapackage.json; do
            [[ "$dp" == datasets/_template/* ]] && continue
            echo "Validating $dp"
            frictionless validate "$dp"
          done

      - name: Check codebooks are up to date
        run: |
          python scripts/build_codebook.py
          if ! git diff --exit-code -- 'datasets/*/codebook.md'; then
            echo "::error::codebook.md is out of date. Run scripts/build_codebook.py and commit."
            exit 1
          fi
